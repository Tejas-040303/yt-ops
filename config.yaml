# yt-ops config
# This file is the single source of truth. Paste it into every Claude Code
# session so the pipeline does not drift.

channel:
  name: "Had To Find Out"
  handle: "@hadtofindout"
  rule: >
    Every video answers one real question, and shows how we know the
    answer: a source behind every claim, and a person, a place, a year or
    a number to anchor it. Not trivia -- how we know.
  pillar: "how we know what we know"   # was "history of scientific discovery"; now lanes.found_out

# --- Hard gates for every lane. Failing one rejects the script. ---
# Lane-specific gates live under lanes.<lane>.gates.
gates:
  check_myth_blacklist: true
  max_similarity_to_past: 0.75     # vs all previous scripts
  # Grey areas. Handed to the model when it picks and writes; no program
  # can check them, so they are also the first thing to read in review.
  banned_topic_areas:
    - medical_advice
    - financial_advice
    - legal_advice
    - religion
    - politics_elections_and_policy_debates
    - current_conflicts_and_terrorism
    - atrocity_and_genocide
    - recent_disasters_and_deaths
    - crime_and_ongoing_trials
    - living_people_controversy_or_private_life
    - children_as_subjects
    - drugs_weapons_and_gambling
    - conspiracy_theories_presented_as_open_questions
    - sexual_content
  # Swipe leads are screened against these words before the model sees
  # them (auto.py leads_from_swipe), so a grey-area hit on a comparable
  # channel never becomes a suggestion. A tripwire, not a judge: it
  # misses a topic phrased without these words, and can drop a harmless
  # title that uses one -- which costs only a lead. The prompt rule above
  # still applies to everything. Whole words, any case.
  banned_lead_keywords:
    medical_advice: [cure, cures, diet, supplement, supplements, weight loss, dosage, symptoms]
    financial_advice: [invest, investing, investment, stocks, crypto, bitcoin, get rich, passive income]
    legal_advice: [lawyer, lawsuit, sue]
    religion: [religion, religious, god, gods, bible, quran, prayer]
    politics_elections_and_policy_debates: [election, elections, vote, voting, president, legalize, legalizing, legalization, abortion, immigration]
    current_conflicts_and_terrorism: [terror, terrorism, terrorist, invasion, airstrike]
    atrocity_and_genocide: [genocide, massacre, holocaust, atrocity]
    recent_disasters_and_deaths: [death toll, killed, victims, tragedy]
    crime_and_ongoing_trials: [crime, crimes, murder, murdered, killer, trial, convicted, arrested]
    children_as_subjects: [child, children, kid, kids]
    drugs_weapons_and_gambling: [drug, drugs, cocaine, heroin, meth, fentanyl, opioid, opioids, cannabis, marijuana, psychedelic, psychedelics, gun, guns, firearm, firearms, weapon, weapons, casino, gambling, betting]
    conspiracy_theories_presented_as_open_questions: [conspiracy, hoax, cover-up, flat earth]
    sexual_content: [sex, sexual, porn]

# --- Lanes: three kinds of video, one channel. ---
# auto.py makes whichever lane is furthest behind its share, or the one
# --lane names. The shares are policy, not tuning: what keeps one video
# distinguishable from the next is a specific, sourced story, and that is
# the line YouTube's inauthentic-content policy draws for a templated,
# synthetic-voice channel. found_out carries that most strongly -- keep
# it the largest share.
lanes:
  found_out:
    share: 0.5
    about: >-
      How somebody found something out: a named person, in a named place,
      in a known year. The strongest subjects are the ones where the
      popular version and the record disagree, because that gap is the
      video.
    range: >-
      science, exploration, inventions, measurement, maps, medicine's
      history (never advice), language, food, sport, everyday objects
    gates:
      must_name_person: true
      must_name_place_or_year: true   # a program can only see the year
      must_name_date: false
      must_carry_specific: true       # a number, a year or a named thing
      min_sources: 4
      min_strong_sources: 1
      strong_kinds: [primary, scholarly]
    domains:
      - plato.stanford.edu
      - archive.org
      - loc.gov
      - royalsocietypublishing.org
      - nasa.gov
      - si.edu                        # Smithsonian
      - biodiversitylibrary.org
      - mathshistory.st-andrews.ac.uk
      - lindahall.org
      - britannica.com
    hashtags: ["#history", "#science", "#howweknow"]

  curiosity:
    share: 0.3
    about: >-
      One everyday question answered properly: why something is the way
      it is, or how it actually works. Phrased as the question a curious
      person would type, answered with something checkable -- a number, a
      date, a named place or thing -- never a vague "scientists say".
    range: >-
      the body (never advice), nature, weather, space, food, language and
      word origins, objects, buildings, transport, maps, money's history
      (never advice), sport rules
    gates:
      must_name_person: false
      must_name_place_or_year: false
      must_name_date: false
      must_carry_specific: true
      min_sources: 3
      min_strong_sources: 1
      strong_kinds: [primary, scholarly, museum, encyclopedia]
    domains:
      - britannica.com
      - si.edu
      - nasa.gov
      - noaa.gov
      - usgs.gov
      - nist.gov
      - loc.gov
      - archive.org
      - merriam-webster.com
      - metoffice.gov.uk
      - plato.stanford.edu
      - royalsocietypublishing.org
      - smithsonianmag.com         # Smithsonian Magazine; si.edu is the institution
      - patents.google.com         # the patent behind an everyday object: primary
      - physics.aps.org            # American Physical Society, open access
    hashtags: ["#science", "#explained", "#howweknow"]

  trending:
    share: 0.2
    about: >-
      Something people are talking about this week, and the checkable
      story behind it: where it came from, how it works, what the record
      says. An explainer that would still be true next month -- never a
      news recap, a reaction, or a take on somebody else's video.
    range: >-
      launches, discoveries, records, anniversaries, viral questions,
      phenomena in the news (weather, space, animals), a new word
    extra_banned:
      - celebrity_news_or_gossip
      - anything_still_unfolding_where_facts_may_change
      - reacting_to_or_summarising_another_creators_video
    gates:
      must_name_person: false
      must_name_place_or_year: false
      must_name_date: true            # a year or a month: a trend has a when
      must_carry_specific: true
      min_sources: 3
      min_strong_sources: 2           # two independent outlets, or the primary source
      strong_kinds: [news, primary]
    domains:
      - reuters.com
      - apnews.com
      - bbc.com
      - bbc.co.uk
      - npr.org
      - nasa.gov
      - noaa.gov
      - si.edu
      - britannica.com
      - loc.gov
    hashtags: ["#explained", "#news", "#howweknow"]

# --- What may appear on screen and in the audio. ---
# Every frame is drawn by a scene_*.py and every sound comes from kokoro
# or make_sfx.py, which is why copyright has not been a risk so far.
# These keep it that way as the subjects widen. A conservative house
# rule, not legal advice.
media:
  original_only: true
  never:
    - clips, stills or screenshots from films, TV, games, other videos or social posts
    - logos, brand marks or product photos
    - a real person's likeness
    - song lyrics, music we did not make, or lines from films, shows or games
  brand_names: "name a brand only to identify it; never imply endorsement"
  max_quote_words: 25              # any quotation, spoken or on a quote_card

# --- Source ranking used during research ---
sources:
  kinds_ranked: [primary, scholarly, museum, encyclopedia, news, popular]
  cache_locally: true              # sources disappear; keep a copy

# --- Which model answers brain.py's research and writing steps. ---
# Every step's prompt and schema is the same whichever you choose.
#   claude_api   the Anthropic API with ANTHROPIC_API_KEY. Needs API
#                credits. Search is locked to each lane's sites.
#   claude_code  the `claude -p` CLI, signed in to your Claude plan --
#                counts against the plan's usage, not API credits. Needs
#                Claude Code installed and signed in on this machine.
#   gemini       Google's Gemini API with GEMINI_API_KEY in .env (free
#                key from Google AI Studio). Weaker for careful research.
# With claude_code and gemini, search cannot be locked to a lane's sites
# up front; auto.py drops any claim whose source is off the lane's list
# afterwards (it runs for claude_api too, as a second check).
# YT_LLM_PROVIDER=gemini in the environment overrides this for one run.
llm:
  provider: claude_code
  claude_code:
    model: opus          # or sonnet, or remove for your plan's default
    timeout: 1800        # seconds per call; research is the long one
  gemini:
    model: gemini-2.5-flash

# --- The youtube-agent-skill fork, used for title lint, the swipe file
# and retention reports. Path is relative to this file. ---
tools:
  youtube_agent_skill: "../youtube-agent-skill"

# --- Comparable channels, for the swipe file (collect_swipe.py). ---
# Their outliers -- videos that beat their own channel's median -- steer
# topic selection as direction, never as titles to copy. Kurzgesagt is
# the closest look (all animation); Veritasium the closest subject (how
# somebody found out). Both are mostly long-form, so the Shorts tab is
# the default: add "videos" to tabs to read their long uploads too.
swipe:
  file: "research/swipe.json"
  tabs: [shorts]
  per_channel: 60                  # newest N from each tab
  skip_newest: 5                   # still gathering views; would read as flops
  leads_per_channel: 4             # best N outliers from EACH channel go to topic selection
  channels:
    - name: "Veritasium"
      url: "https://www.youtube.com/@veritasium"
    - name: "Kurzgesagt"
      url: "https://www.youtube.com/@kurzgesagt"

# --- Accounts (competing versions of the story) ---
accounts:
  stances: [popular, consensus, disputed, superseded, fringe]
  never_voice_as_true: [fringe]
  # If popular != consensus, that gap IS the video.
  prefer_angle_when_gap: myth_bust

# --- Angles: one topic yields several standalone videos ---
angles:
  kinds: [myth_bust, origin, mechanism, person, consequence, unknown_still]
  max_per_topic: 4
  min_days_between_same_topic: 3   # never publish two from one topic back to back
  must_stand_alone: true           # NO "part 1", NO "as we saw last time"

# --- Script ---
script:
  target_words: [95, 150]
  target_seconds: [35, 55]
  hook_max_words: 12
  formats: [story_reveal, myth_reality, question_answer, three_facts, timeline]
  banned_openers:
    - "Did you know"
    - "Hey guys"
    - "In this video"
    - "Let's dive in"
  require_citation_per_claim: true

# --- Voice ---
voice:
  engine: kokoro
  model: kokoro-v1
  narrator: "bf_emma"              # locked. Consistency matters more than variety
  quote: "bm_george"               # second voice, for source quotations only
  speed: 1.05
  sample_rate: 24000

# --- Captions ---
captions:
  engine: faster-whisper
  model: base.en
  word_timestamps: true
  style: ass
  max_words_on_screen: 4
  font: "Inter"
  safe_area_bottom_pct: 22         # keep above the YouTube UI overlay

# --- Render ---
render:
  resolution: [1080, 1920]
  fps: 30
  audio_lufs: -14
  crf: 20
  music_volume_db: -22
  max_concurrent: 1                # more than 1 gets you OOM-killed

# --- Assets ---
assets:
  allowed_licenses: [public_domain, cc0, pexels, generated, original]
  reject_unknown: true
  require_manifest_row: true
  attribution_in_description: true

# --- Output ---
output:
  dir: "out"
  code_format: "{seq:04d}-{topic_slug}-{angle_kind}"
  write_metadata_txt: true         # title, description, hashtags, AI-disclosure reminder

# --- Publishing (manual by you) ---
publish:
  per_day: 2
  slots: ["08:55", "16:30"]
  method: manual_upload_scheduled  # upload in one sitting, schedule in Studio
  ai_disclosure_toggle: true       # tick "altered or synthetic content" every time

# --- Analytics ---
analytics:
  pull_time: "23:00"
  api: youtube_analytics_v2
  scopes:
    - https://www.googleapis.com/auth/youtube.readonly
    - https://www.googleapis.com/auth/yt-analytics.readonly
  review_every_n_videos: 25        # look at patterns, do NOT compute p-values

# --- Ops ---
ops:
  db: "db.sqlite"
  telegram_alerts: [render_failed, oauth_expired, no_video_ready_by_0830]
  log_level: INFO